# PostgreSQL Verbindung für Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5439/roampalsDB}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:roampalsPW}

#server.servlet.context-path=/api
server.port=8090

# Steuert, wie Hibernate mit den Tabellen umgeht (erstellt sie automatisch, falls nicht vorhanden)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=true
# Sagt Spring Boot, welche Datei zum Daten-Seeding genutzt werden soll
spring.sql.init.data-locations=classpath:import.sql

# JWT - no default on purpose: the app must fail to start rather than run
# with a signing secret that is public in this repo.
# Generate one with: openssl rand -hex 64
jwt.token.secret=${JWT_TOKEN_SECRET}
jwt.token.prefix=${JWT_TOKEN_PREFIX:Bearer}
